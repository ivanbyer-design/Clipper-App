<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipper</title>
<meta name="description" content="Clipper — run your clipping workflow: accounts, campaigns, content and review.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f12;--panel:#15181d;--panel2:#1c2027;--line:#2a2f38;--text:#e8eaed;--muted:#8b93a1;
  --accent:#c6ff3d;--accent-ink:#0d0f12;--accent-soft:rgba(198,255,61,.12);
  --warn:#ffb648;--bad:#ff6b6b;--good:#3ddc97;--gold:#ffcf3d;--gold-soft:rgba(255,207,61,.14);--radius:12px;
  --shadow:0 10px 40px rgba(0,0,0,.45);
  --tt:#25f4ee;--yt:#ff3b30;--ig:#e1306c;--x:#e7e9ea;--hdr:#060708;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f3f4f0;--panel:#ffffff;--panel2:#eef0ea;--line:#dcdfd6;--text:#15171b;--muted:#5d6470;
  --accent:#4f7300;--accent-ink:#ffffff;--accent-soft:rgba(79,115,0,.10);--warn:#a86400;--bad:#c62828;--good:#16804f;
  --gold:#8a6400;--gold-soft:rgba(138,100,0,.10);--shadow:0 10px 40px rgba(0,0,0,.12);--tt:#0a9a96;--x:#0f1419;--hdr:#15171b;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;overflow-x:hidden}
a{color:var(--accent)}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:26px}
h2{font-size:22px}
h3{font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
/* app shell: dark top bar + left sidebar (same layout as the trading journal) */
.hdr{position:sticky;top:0;z-index:30;height:58px;background:var(--hdr);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px 0 10px}
.hdr .spacer{flex:1}
.burger{width:38px;height:38px;border-radius:8px;border:0;background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center}
.burger:hover{background:rgba(255,255,255,.08)}
.logo{display:flex;align-items:center;gap:9px;font-family:"Space Grotesk";font-weight:700;font-size:20px;color:#fff;text-decoration:none}
.logo .mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px}
.hbtn{height:36px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font:600 13px Inter;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.14)}
#todayLbl{color:rgba(255,255,255,.6);font-size:13px}
.app{display:flex;align-items:flex-start;background:var(--hdr);min-height:calc(100vh - 58px)}
.side{position:sticky;top:58px;height:calc(100vh - 58px);width:236px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px 14px;overflow-y:auto;border-top-left-radius:14px;display:flex;flex-direction:column;transition:margin .25s ease}
body.sb-collapsed .side{margin-left:-236px}
main{flex:1;min-width:0;background:var(--bg);min-height:calc(100vh - 58px);padding:22px 26px 80px}
body.sb-collapsed main{border-top-left-radius:14px}
main>*{max-width:1440px;margin-left:auto;margin-right:auto}
.sb-add{position:relative;margin-bottom:16px}
.sb-add-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:9px;border:0;background:var(--accent);color:var(--accent-ink);font:600 14px Inter;cursor:pointer;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.sb-add-btn:hover{filter:brightness(1.08)}
.dd-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:35;padding:6px}
.sb-add.open .dd-menu{display:block}
.dd-opt{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:7px;border:0;background:none;color:var(--text);font:500 13px Inter;cursor:pointer}
.dd-opt small{display:block;font-size:11px;color:var(--muted);margin-top:2px;font-weight:400}
.dd-opt:hover{background:var(--panel2)}
.nav-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 12px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:2px;border-radius:9px;color:var(--text);font:500 14px Inter;text-decoration:none;cursor:pointer}
.nav-item svg{color:var(--muted);flex:none}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item.active svg{color:var(--accent)}
.nav-item .h{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .c{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--panel2);color:var(--muted);font-weight:600}
.nav-item .c.w{color:var(--warn)}
.nav-item .star{color:var(--gold);font-size:12px}
.nav-acct{gap:10px}
.nav-acct.open{font-weight:600}
.nav-sub{margin:0 0 6px 16px;padding-left:6px;border-left:1px solid var(--line)}
.nav-sub .nav-sub{margin-left:12px}
.nav-sub .nav-item{padding:7px 10px;font-size:13px;gap:10px}
.nav-sep{height:1px;background:var(--line);margin:12px 4px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.side-foot .btn{justify-content:center}
.side-bd{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:44;backdrop-filter:blur(2px)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nowrap{flex-wrap:nowrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.tile .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile .v{font-family:"Space Grotesk";font-size:28px;font-weight:700;margin-top:4px}
.tile .s{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font:600 13px Inter;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.ghost{background:none;border-color:transparent}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.w{color:var(--warn)} .chip.b{color:var(--bad)} .chip.g{color:var(--good)}
.chip.click{cursor:pointer}
.chip.click.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font:700 11px Inter;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tag.paid{background:var(--gold-soft);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.tag.unpaid{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.bar{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.gold>i{background:var(--gold)}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.todo:first-child{border-top:0}
.todo .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--accent)}
.todo .dot.w{background:var(--warn)} .todo .dot.b{background:var(--bad)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
input,select,textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:14px Inter}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
select.inline{width:auto;max-width:220px;padding:7px 9px;font-size:13px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fields .full{grid-column:1/-1}
.checks{display:flex;flex-direction:column;gap:6px}
.checks.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.checks input{width:auto;accent-color:var(--accent)}
.section-t{font-family:"Space Grotesk";font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);grid-column:1/-1;margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:26px}
.sec-h h2{font-size:18px}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--text)}
/* dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.dash aside{position:sticky;top:120px}
.pb{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:700 12px "Space Grotesk";color:#fff;flex:none;letter-spacing:.02em}
.pb.lg{width:52px;height:52px;border-radius:13px;font-size:16px}
.pb.xs{width:20px;height:20px;border-radius:5px;font-size:9px}
.pb.TikTok{background:#010101;color:#25f4ee;box-shadow:inset -2px -2px 0 #fe2c55}
.pb.YouTube{background:#ff0000}
.pb.Instagram{background:linear-gradient(45deg,#f58529,#dd2a7b 55%,#8134af)}
.pb.X{background:#000;color:#fff;font-size:15px;box-shadow:inset 0 0 0 1px #333}
.pb.X.lg{font-size:24px}
.pb.X.xs{font-size:11px}
.acard{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--pc,var(--line));border-radius:var(--radius);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,transform .15s;min-width:0}
.acard:hover{border-color:var(--muted);border-top-color:var(--pc);transform:translateY(-1px)}
.acard .h{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .id{display:flex;gap:10px;align-items:center;min-width:0;flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:left}
.stats .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stats b{font-family:"Space Grotesk";font-size:17px}
.addcard{border:1px dashed var(--line);border-radius:var(--radius);display:grid;place-items:center;min-height:150px;color:var(--muted);cursor:pointer;font-weight:600;background:none}
.addcard:hover{border-color:var(--accent);color:var(--accent)}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .grow{flex:1;min-width:200px}
/* resources */
.res{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.res .frame{background:#000;position:relative;aspect-ratio:16/9}
.res .frame.tall{aspect-ratio:9/16;max-height:620px;margin:0 auto;width:100%}
.res .frame.doc{aspect-ratio:4/3;background:var(--panel2)}
.res iframe,.res video,.res img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain}
.res .meta{padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.res .meta .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res.link .frame{display:none}
.res.link .meta{padding:14px}
.paste{display:grid;grid-template-columns:1fr 200px auto;gap:8px}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:0 0 250px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.col h3{font-size:14px;display:flex;justify-content:space-between;padding:2px 4px 10px}
.kc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.kc:hover{border-color:var(--muted)}
.kc .t{font-weight:600;font-size:14px;margin-bottom:4px;word-break:break-word}
.kc .m{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.kc .mv{display:flex;justify-content:space-between;margin-top:8px}
.who{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{background:none;border:0;color:var(--muted);font:600 13px Inter;padding:6px 10px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.win{background:linear-gradient(180deg,var(--accent-soft),transparent 70%),var(--panel);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.win .x{font:700 22px "Space Grotesk";color:var(--accent)}
.hookrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hookrow:first-child{border-top:0}
.hookrow .q{flex:1;min-width:0}
/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:30px 12px;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:780px;box-shadow:var(--shadow)}
.modal .hd{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal .bd{padding:18px}
.modal .ft{display:flex;gap:8px;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.step{display:flex;gap:14px}
.step .n{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700}
.step ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.step li{margin:3px 0}
.hbar{display:grid;grid-template-columns:minmax(70px,1fr) minmax(40px,1.2fr) auto;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.hbar .bar{height:10px}
.insight{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.insight:first-child{border-top:0}
.insight .i{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;background:var(--accent-soft);color:var(--accent)}
.insight .i.w{background:var(--gold-soft);color:var(--warn)}
.flash{animation:flash 1.8s ease-out 1;border-radius:10px}
@keyframes flash{0%,45%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:11px Inter}
.chart .lbl{fill:var(--text);font:600 12px Inter}
.chart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart-empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:16px;font-size:14px}
.ctip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:var(--shadow);font-size:12px;min-width:150px;z-index:5;display:none}
.ctip .d{color:var(--muted);margin-bottom:4px}
.ctip .r{display:flex;align-items:center;gap:8px;margin-top:3px;white-space:nowrap}
.ctip .r i{width:12px;height:2px;border-radius:1px;flex:none}
.ctip .r b{font-variant-numeric:tabular-nums;color:var(--text)}
.ctip .r span{color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:2px;border-radius:1px}
.ctable{margin-top:8px}
.ctable summary{cursor:pointer}
.ctable table{font-size:12px;margin-top:6px}
.spark{width:100%;height:42px;display:block}
.spark-empty{height:42px;display:grid;place-items:center;border:1px dashed var(--line);border-radius:8px}
/* brands */
.brands{display:flex;flex-direction:column;gap:12px}
.acard.brow{display:grid;grid-template-columns:minmax(190px,1.1fr) minmax(250px,1.5fr) minmax(170px,1fr);align-items:center;gap:20px}
.brow .id{align-items:flex-start}
.addcard.slim{min-height:64px}
@media (max-width:1150px){.acard.brow{grid-template-columns:1fr;gap:12px}}
.blogo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:700 16px "Space Grotesk";background:var(--accent-soft);color:var(--accent);overflow:hidden;flex:none}
.blogo img{width:100%;height:100%;object-fit:cover;display:block}
.blogo.lg{width:64px;height:64px;font-size:22px;border-radius:16px}
.blogo.xs{width:22px;height:22px;border-radius:6px;font-size:9px}
/* pomodoro drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line);z-index:40;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;box-shadow:var(--shadow);visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .bd{padding:16px;overflow-y:auto;flex:1}
.ring{position:relative;width:220px;height:220px;margin:4px auto}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{transition:stroke-dashoffset .5s linear}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .t b{font:700 46px "Space Grotesk";font-variant-numeric:tabular-nums}
.tomatoes{display:flex;gap:6px;flex-wrap:wrap}
.tomatoes i{width:14px;height:14px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
.tomatoes i.on{background:var(--bad);border-color:var(--bad)}
.pomo-btn{font-variant-numeric:tabular-nums}
.pomo-btn.run{background:var(--accent);color:var(--accent-ink);border-color:transparent}
@media (min-width:1260px){body.pomo-open{padding-right:340px}}
@media (max-width:900px){
  .dash{grid-template-columns:minmax(0,1fr)}
  .dash aside{position:static}
}
@media (max-width:768px){
  .side{position:fixed;top:0;left:0;bottom:0;height:100vh;z-index:45;border-radius:0;transform:translateX(-100%);transition:transform .2s ease;margin-left:0!important}
  .side.open{transform:none}
  .side-bd.open{display:block}
  main{padding:16px 16px 80px;border-radius:0!important}
  #todayLbl{display:none}
  .hdr{padding:0 10px 0 6px}
}
@media (max-width:600px){
  .tile .v{font-size:22px}
  .paste{grid-template-columns:1fr}
  .stats b{font-size:15px}
}

<body>
<div class="side-bd" id="sideBd" onclick="closeSide()"></div>
<header class="hdr">
  <button class="burger" onclick="toggleSide()" aria-label="Toggle menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <a class="logo" href="#/accts"><span class="mark">✂</span>Clipper</a>
  <div class="spacer"></div>
  <span id="todayLbl"></span>
  <button class="hbtn pomo-btn" id="pomoBtn" onclick="togglePomo()" aria-label="Focus timer">⏱ Focus</button>
</header>
<div class="app">
  <aside class="side" id="side" aria-label="Pages"></aside>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>
<aside class="drawer" id="pomo" aria-label="Focus timer"></aside>

<script>
/* ---------- constants ---------- */
const LS_KEY='clipper.v1';
const STAGES=['Idea','Editing','Ready','Posted','Submitted','Approved','Paid','Rejected'];
const PLATFORMS=['TikTok','YouTube','Instagram','X'];
const PSHORT={TikTok:'TT',YouTube:'YT',Instagram:'IG',X:'𝕏'};
const PCOLOR={TikTok:'var(--tt)',YouTube:'var(--yt)',Instagram:'var(--ig)',X:'var(--x)'};
const HOOKS=['Money claim','Hot take','Story','Funny','Question','Shock stat','Reaction','Other'];
const EDIT_STYLES=['Talking-head crop','Split screen','Gameplay / B-roll background','Big bold captions','Word-by-word captions','Zoom punch-ins','Meme / SFX inserts','Voiceover','Text story','Reaction overlay'];
const MARKETS=['Whop Content Rewards','Duzlo','Other'];
const CAMP_STATUS=['Scouting','Active','Paused','Ended'];
const ACCT_STATUS=['Warming up','Active','Paused','Flagged'];
const EDIT_CHECKS=['9:16, framed on speaker','Hook text in first frame','Dead air & filler cut','Captions burned in','Zoom punch-ins on key lines','Own layer added (title / context / voiceover)','Required tags & mentions added','Watched full clip on phone'];
const WARMUP=['Profile pic, name & bio set','Day 1 — scroll & engage niche','Day 2 — scroll & engage niche','Day 3 — scroll & engage niche','Day 4 — scroll & engage niche','Day 5 — first post'];
const CAMP_CHECKS=['Read the full brief','Source has strong moments','My platforms are allowed'];

/* ---------- state ---------- */
const defaults=()=>({settings:{dailyTarget:3,feePct:10,niche:'Trading / finance',hashtagBank:'#trading #daytrading #futures #stockmarket #money #finance #investing'},brands:[],accounts:[],campaigns:[],clips:[],resources:[]});
function migrate(d){
  const pm={'YouTube Shorts':'YouTube','Instagram Reels':'Instagram'};
  d.accounts.forEach(a=>{a.platform=pm[a.platform]||a.platform;if(!a.monetized)a.monetized='Unpaid';if(a.brandId==null)a.brandId='';
    if(!Array.isArray(a.fhist)){const n=new Date(),d=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
      a.fhist=a.followers!==''&&a.followers!=null?[{d,f:parseFloat(a.followers)||0}]:[]}});
  if(!Array.isArray(d.brands))d.brands=[];
  d.campaigns.forEach(k=>{if(!Array.isArray(k.accountIds))k.accountIds=[];k.platforms=(k.platforms||[]).map(p=>pm[p]||p)});
  d.clips.forEach(c=>{if(c.postUrl==null)c.postUrl=c.urlTT||c.urlYT||c.urlIG||'';if(!Array.isArray(c.editStyle))c.editStyle=[];if(c.accountId==null)c.accountId=''});
  if(!Array.isArray(d.resources))d.resources=[];
  return d;
}
function hydrate(d){const base=defaults();return migrate({...base,...d,settings:{...base.settings,...(d.settings||{})}})}
let LOAD_ERR=null;
let S=load();
let R={v:'accts',id:''};
let acctFilter='all';
let CF={acct:'',camp:'',mode:'board'};
try{CF.mode=localStorage.getItem(LS_KEY+'.cmode')||'board'}catch(e){}
let reviewSort={k:'views7',d:-1};
let capState={clipId:'',transcript:'',tags:[]};
let MED=0;

function load(){
  let r=null;try{r=localStorage.getItem(LS_KEY)}catch(e){}
  if(r){try{return hydrate(JSON.parse(r))}catch(e){LOAD_ERR=e;console.error('Clipper: could not read saved data',e)}}
  return defaults();
}
function save(){if(LOAD_ERR){toast('Saved data could not be read — not overwriting it. Export a backup in Settings.');return}try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){toast('Could not save — export a backup in Settings')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(String(u||'').trim())?String(u).trim():'';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const daysAgo=s=>{if(!s)return null;const a=new Date(s+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.round((b-a)/864e5)};
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const fmtN=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'K':String(Math.round(n));
const fmt$=n=>'$'+(Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:n<100?2:0,maximumFractionDigits:2});
const camp=id=>S.campaigns.find(c=>c.id===id);
const acct=id=>S.accounts.find(a=>a.id===id);
const views=c=>num(c.views7)||num(c.views48);
const isPosted=c=>c.postedAt&&c.stage!=='Rejected';
function est(c){
  if(num(c.paid))return num(c.paid);
  if(c.stage==='Rejected')return 0;
  const k=camp(c.campaignId);if(!k||!num(k.cpm))return 0;
  const v=views(c);if(num(k.minViews)&&v<num(k.minViews))return 0;
  let g=v/1000*num(k.cpm);if(num(k.maxPerClip))g=Math.min(g,num(k.maxPerClip));
  return g*(1-num(S.settings.feePct)/100);
}
function campScore(k){
  let s=0;const checks=k.checks||[];
  if(num(k.cpm)>=1)s++;
  if(k.budgetLeft===''||k.budgetLeft==null||num(k.budgetLeft)>=30)s++;
  s+=CAMP_CHECKS.filter(x=>checks.includes(x)).length;
  return s; // out of 5
}
function median(a){if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
const medViews=()=>median(S.clips.filter(isPosted).map(views).filter(Boolean));
const mult=c=>MED&&views(c)?views(c)/MED:0;
function streak(){
  const days=new Set(S.clips.filter(isPosted).map(c=>c.postedAt));let n=0;const d=new Date();
  if(!days.has(iso(d)))d.setDate(d.getDate()-1);
  while(days.has(iso(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function acctCamps(a){return S.campaigns.filter(k=>(k.accountIds||[]).includes(a.id)||S.clips.some(c=>c.accountId===a.id&&c.campaignId===k.id))}
function acctStats(a){
  const cs=S.clips.filter(c=>c.accountId===a.id);const posted=cs.filter(isPosted);
  return {clips:cs.length,posted:posted.length,views:posted.reduce((s,c)=>s+views(c),0),earned:cs.reduce((s,c)=>s+est(c),0),camps:acctCamps(a).length};
}
const pb=(p,cls='')=>`<span class="pb ${esc(p)} ${cls}" title="${esc(p)}">${PSHORT[p]||'?'}</span>`;
const mtag=a=>a.monetized==='Paid'?'<span class="tag paid">★ Paid</span>':'<span class="tag unpaid">Unpaid</span>';
const acctLabel=c=>{const a=acct(c.accountId);return a?`${a.handle} · ${PSHORT[a.platform]||a.platform}`:''};
const who=a=>a?`<span class="who">${pb(a.platform,'xs')}${esc(a.handle)}</span>`:'';
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copied')}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied')}catch(_){toast('Copy failed')}ta.remove()}}

/* ---------- routing ---------- */
const VIEWS={accts:()=>vAccts(),brand:()=>vBrand(R.id),acct:()=>vAcct(R.id,R.sec),camps:()=>vCamps(),camp:()=>vCamp(R.id),caps:()=>vCaps(),play:()=>vPlay(),settings:()=>vSettings()};
function parseHash(){const [v,id,sec]=location.hash.replace(/^#\/?/,'').split('/');R={v:VIEWS[v]?v:'accts',id:id||'',sec:sec||''}}
function go(v,id,sec){const h='#/'+[v,id,sec].filter(Boolean).join('/');if(location.hash===h)render();else location.hash=h}
window.addEventListener('hashchange',()=>{parseHash();closeSide();window.scrollTo(0,0);render()});
let TODOS=[];
let FOCUS=null;
function render(){
  TODOS=todos();
  const a=R.v==='acct'&&acct(R.id);
  if(a&&CF.acct!==a.id){CF.acct=a.id;CF.camp=''}
  MED=a?median(S.clips.filter(c=>c.accountId===a.id&&isPosted(c)).map(views).filter(Boolean)):medViews();
  renderSide();
  document.getElementById('todayLbl').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
  CHARTS={};chartN=0;
  document.getElementById('view').innerHTML=VIEWS[R.v]();
  drawCharts();
  if(R.v==='caps')capPreview();
  applyFocus();
}
/* jump from a to-do to the place in the account where it gets done */
function doTodo(i){
  const t=TODOS[i];if(!t)return;
  if(!t.to){t.fn();return}
  FOCUS=t.focus||null;
  if(FOCUS&&FOCUS.clip){CF.mode='board';CF.camp=''}
  go(...t.to);
}
function applyFocus(){
  if(!FOCUS)return;const f=FOCUS;FOCUS=null;
  requestAnimationFrame(()=>{
    const el=f.sel&&document.querySelector(f.sel);
    if(el){el.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
    if(f.clip)setTimeout(()=>{editClip(f.clip);const inp=document.getElementById('f_'+f.field);
      if(inp){inp.scrollIntoView({block:'center'});inp.focus();inp.parentElement.classList.add('flash')}},el?500:0);
  });
}

/* ---------- left sidebar ---------- */
const svg=(d,fill)=>`<svg width="18" height="18" viewBox="0 0 24 24" ${fill?'fill="currentColor"':'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"'} aria-hidden="true">${d}</svg>`;
const IC={
  dash:svg('<rect x="3" y="3" width="8" height="10" rx="1.5"/><rect x="13" y="3" width="8" height="6" rx="1.5"/><rect x="3" y="15" width="8" height="6" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/>',1),
  '':svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  camps:svg('<path d="M4 21V4"/><path d="M4 4h12l-2 4 2 4H4"/>'),
  content:svg('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>'),
  review:svg('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  res:svg('<path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/>'),
  allcamps:svg('<path d="M3 7h18M3 12h18M3 17h12"/>'),
  caps:svg('<path d="M4 6h16M4 12h10M4 18h7"/><path d="M17 15l4 4M21 15l-4 4"/>'),
  play:svg('<path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z"/><path d="M4 19.5A2 2 0 0 1 6 18h13"/><path d="M9 7h6M9 11h4"/>'),
  settings:svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'),
};
function sideCtx(){
  let a=null,sec=null,b=null;
  if(R.v==='acct'&&acct(R.id)){a=acct(R.id);sec=ASEC.some(([k])=>k===R.sec)?R.sec:''}
  else if(R.v==='camp'){const k=camp(R.id);const aid=k&&k.accountIds.find(acct);if(aid){a=acct(aid);sec='camps'}}
  if(R.v==='brand')b=brand(R.id);else if(a)b=brand(a.brandId);
  return {a,sec,b,bid:b?b.id:(a?'':null)};
}
function renderSide(){
  const {a,sec,b,bid}=sideCtx();
  const item=(href,icon,label,on,extra='',cls='')=>`<a class="nav-item ${cls} ${on?'active':''}" href="${href}">${icon}<span class="h">${label}</span>${extra}</a>`;
  const cnt=x=>({camps:acctCamps(x).length,content:S.clips.filter(c=>c.accountId===x.id).length,res:S.resources.filter(r=>r.accountId===x.id&&!r.campaignId).length});
  const due=ids=>TODOS.filter(t=>ids.includes(t.acct)).length;
  const acctRow=x=>{const open=a&&a.id===x.id;const c=cnt(x);const d=due([x.id]);
    return `<a class="nav-item nav-acct ${open?'open':''} ${open&&sec===''?'active':''}" href="#/acct/${x.id}">${pb(x.platform,'xs')}<span class="h">${esc(x.handle)}</span>${x.monetized==='Paid'?'<span class="star" title="Paid">★</span>':''}${d&&!open?`<span class="c w">${d}</span>`:''}</a>
    ${open?`<div class="nav-sub">${ASEC.filter(([k])=>k).map(([k,l])=>item(`#/acct/${x.id}/${k}`,IC[k],l,sec===k,c[k]!=null?`<span class="c">${c[k]}</span>`:'')).join('')}</div>`:''}`};
  const unb=brandAccts('');
  document.getElementById('side').innerHTML=`
  <div class="sb-add" id="sbAdd">
    <button class="sb-add-btn" onclick="toggleAdd(event)">${svg('<path d="M12 5v14M5 12h14"/>')}Add</button>
    <div class="dd-menu">
      <button class="dd-opt" onclick="addPick(()=>editClip())">New clip<small>One moment to edit and post</small></button>
      <button class="dd-opt" onclick="addPick(bulkAdd)">Bulk add moments<small>Paste timestamps from Opus Clip</small></button>
      <button class="dd-opt" onclick="addPick(()=>editCamp(null,${a?`{accountIds:['${a.id}']}`:'null'}))">New campaign<small>${a?`Linked to ${esc(a.handle)}`:'From Whop, Duzlo or anywhere'}</small></button>
      <button class="dd-opt" onclick="addPick(()=>editAcct())">New account<small>${b?`Under ${esc(b.name)}`:'TikTok, YouTube, Instagram or X'}</small></button>
      <button class="dd-opt" onclick="addPick(()=>editBrand())">New brand<small>Groups a set of social accounts</small></button>
    </div>
  </div>
  <nav>
    ${item('#/accts',IC.dash,'Dashboard',R.v==='accts',TODOS.length?`<span class="c">${TODOS.length}</span>`:'')}
    <div class="nav-lbl">Brands</div>
    ${S.brands.map(x=>{const open=bid===x.id;const as=brandAccts(x.id);const d=due(as.map(y=>y.id));
      return `<a class="nav-item nav-acct ${open?'open':''} ${R.v==='brand'&&open?'active':''}" href="#/brand/${x.id}">${blogo(x,'xs')}<span class="h">${esc(x.name)}</span>${d&&!open?`<span class="c w">${d}</span>`:`<span class="c">${as.length}</span>`}</a>
      ${open?`<div class="nav-sub">${as.map(acctRow).join('')||'<div class="muted small" style="padding:6px 10px">No accounts yet</div>'}</div>`:''}`}).join('')}
    ${unb.length?`<a class="nav-item nav-acct muted ${bid===''?'open':''}" href="#/accts">${svg('<circle cx="12" cy="12" r="9"/><path d="M9 12h6"/>')}<span class="h">No brand</span><span class="c">${unb.length}</span></a>
      ${bid===''?`<div class="nav-sub">${unb.map(acctRow).join('')}</div>`:''}`:''}
    ${S.brands.length?'':`<a class="nav-item" href="javascript:void 0" onclick="editBrand()"><span class="h muted">+ Create your first brand</span></a>`}
    <div class="nav-sep"></div>
    ${item('#/camps',IC.allcamps,'All campaigns',R.v==='camps')}
    ${item('#/caps',IC.caps,'Captions',R.v==='caps')}
    ${item('#/play',IC.play,'Playbook',R.v==='play')}
    ${item('#/settings',IC.settings,'Settings',R.v==='settings')}
  </nav>
  <div class="side-foot">
    <div class="nav-lbl" style="margin:0 2px 8px">Backup</div>
    <button class="btn sm" onclick="exportJSON()">↓ Export backup</button>
    <label class="btn sm">↑ Import backup<input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(this)"></label>
  </div>`;
}
function toggleAdd(ev){ev.stopPropagation();document.getElementById('sbAdd').classList.toggle('open')}
function addPick(fn){document.getElementById('sbAdd').classList.remove('open');closeSide();fn()}
document.addEventListener('click',()=>{const m=document.getElementById('sbAdd');if(m)m.classList.remove('open')});
const mobile=()=>window.innerWidth<=768;
function toggleSide(){
  if(!mobile()){const c=document.body.classList.toggle('sb-collapsed');try{localStorage.setItem(LS_KEY+'.sb',c?'1':'')}catch(e){}return}
  const open=!document.getElementById('side').classList.contains('open');
  document.getElementById('side').classList.toggle('open',open);document.getElementById('sideBd').classList.toggle('open',open);
}
function closeSide(){document.getElementById('side').classList.remove('open');document.getElementById('sideBd').classList.remove('open')}
try{if(localStorage.getItem(LS_KEY+'.sb'))document.body.classList.add('sb-collapsed')}catch(e){}

/* ---------- generic form modal ---------- */
let FORM=null;
const optsOf=f=>(typeof f.options==='function'?f.options():f.options).map(o=>Array.isArray(o)?o:[o,o]);
function field(f,val){
  const id='f_'+f.k;
  if(f.type==='section')return `<div class="section-t">${esc(f.label)}</div>`;
  let input='';
  if(f.type==='select')input=`<select id="${id}">${optsOf(f).map(([v,l])=>`<option value="${esc(v)}" ${String(val??'')===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  else if(f.type==='image')input=`<div class="row"><input type="hidden" id="${id}" value="${esc(val)}"><span class="blogo lg" id="${id}_prev">${val?`<img src="${esc(val)}" alt="">`:'—'}</span><label class="btn sm">Upload image<input type="file" accept="image/*" style="display:none" onchange="pickLogo(this)"></label>${'<button type="button" class="btn sm ghost" onclick="clearLogo()">Remove</button>'}</div>`;
  else if(f.type==='textarea')input=`<textarea id="${id}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
  else if(f.type==='multi'){const arr=val||[];const o=optsOf(f);
    input=o.length?`<div class="checks ${o.length>6?'cols':''}" id="${id}">${o.map(([v,l])=>`<label><input type="checkbox" value="${esc(v)}" ${arr.includes(v)?'checked':''}>${esc(l)}</label>`).join('')}</div>`:`<div class="muted small" id="${id}">${esc(f.none||'Nothing to pick yet.')}</div>`}
  else input=`<input id="${id}" type="${f.type||'text'}" value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${f.type==='number'?'step="any" inputmode="decimal"':''}>`;
  const full=f.full||f.type==='multi'||f.type==='textarea';
  return `<div class="${full?'full':''}"><label class="f" for="${id}">${esc(f.label)}</label>${input}${f.hint?`<div class="muted small" style="margin-top:4px">${esc(f.hint)}</div>`:''}</div>`;
}
function openForm(title,fields,obj,onSave,onDelete,extra){
  FORM={fields,obj,onSave,onDelete,extra};
  const ov=document.createElement('div');ov.className='ov';ov.id='ov';
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="hd"><h3>${esc(title)}</h3><button class="btn ghost" onclick="closeForm()" aria-label="Close">✕</button></div>

function recordFollowers(a,v,d){

const acctPts=a=>(a.fhist||[]).map(h=>({t:toT(h.d),v:num(h.f)}));
function valAt(pts,t){let v=null;for(const p of pts){if(p.t<=t)v=p.v;else break}return v}
/* sum of several accounts' followers, carried forward between logs */
function sumPts(accts){
  const all=accts.map(acctPts).filter(p=>p.length);
  const ts=[...new Set(all.flatMap(p=>p.map(x=>x.t)))].sort((x,y)=>x-y);
  return ts.map(t=>({t,v:all.reduce((s,p)=>s+(valAt(p,t)??0),0)}));
}
/* followers gained over the last n days (accounts logged later count from their first log) */
function gain(accts,n){
  const tp=toT(today())-n*DAY;
  return accts.reduce((s,a)=>{const p=acctPts(a);if(!p.length)return s;const past=valAt(p,tp)??p[0].v;return s+(p[p.length-1].v-past)},0);
}

let CHARTS={},chartN=0;
const fmtD=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function chartBox(series,opts={}){

  </tbody></table></div></details>`:''}`;
}
function niceStep(r){const e=Math.pow(10,Math.floor(Math.log10(r||1))),f=r/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function drawChart(id){
  const el=document.getElementById(id),spec=CHARTS[id];if(!el||!spec)return;
  const ser=spec.series.filter(s=>s.points.length);
  if(!ser.length){el.innerHTML=`<div class="chart-empty">No follower history yet. Log a follower count to start the graph.</div>`;return}
  const W=el.clientWidth||600,H=el.clientHeight||220;
  const ts=[...new Set(ser.flatMap(s=>s.points.map(p=>p.t)))].sort((x,y)=>x-y);
  let t1=Math.max(ts[ts.length-1],toT(today())),t0=Math.min(ts[0],t1-6*DAY);
  const vals=ser.flatMap(s=>s.points.map(p=>p.v));
  let lo=Math.min(...vals),hi=Math.max(...vals);
  if(hi===lo){hi=hi+Math.max(10,hi*.1);lo=Math.max(0,lo-Math.max(10,lo*.1))}
  if(lo<hi*.35)lo=0;
  const step=niceStep((hi-lo)/4);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi===lo)hi=lo+step;
  const labels=ser.length>1&&ser.length<=4&&W>520;
  const L=48,Rp=labels?96:16,T=12,B=26,pw=Math.max(40,W-L-Rp),ph=H-T-B;
  const x=t=>L+(t-t0)/(t1-t0)*pw,y=v=>T+ph-(v-lo)/(hi-lo)*ph;
  let g='';
  for(let v=lo;v<=hi+step/2;v+=step)g+=`<line x1="${L}" x2="${L+pw}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${fmtN(v)}</text>`;
  const nx=Math.max(2,Math.min(6,Math.floor(pw/110)));
  let xl='';for(let i=0;i<=nx;i++){const t=t0+(t1-t0)*i/nx;xl+=`<text class="ax" x="${x(t)}" y="${H-6}" text-anchor="${i===0?'start':i===nx?'end':'middle'}">${fmtD(t)}</text>`}
  let marks='';
  ser.forEach(s=>{
    const d=s.points.map((p,i)=>`${i?'L':'M'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
    if(ser.length===1&&s.points.length>1)marks+=`<path d="${d}L${x(s.points[s.points.length-1].t)},${y(lo)}L${x(s.points[0].t)},${y(lo)}Z" fill="${s.color}" opacity=".12"/>`;
    marks+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.points.length<=40)marks+=s.points.map(p=>`<circle cx="${x(p.t)}" cy="${y(p.v)}" r="4" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>`).join('');
  });
  let lab='';
  if(labels){
    const ends=ser.map(s=>{const p=s.points[s.points.length-1];return {s,y:y(p.v),x:x(p.t),v:p.v}}).sort((a,b)=>a.y-b.y);
    for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<14)ends[i].y=ends[i-1].y+14;
    lab=ends.map(e=>`<text class="lbl" x="${L+pw+8}" y="${e.y+4}">${esc((n=>n.length>14?n.slice(0,13)+'…':n)(e.s.short||e.s.name))}</text>`).join('');
  }
  el.innerHTML=`<svg width="${W}" height="${H}"><g class="grid">${g}</g>${xl}${marks}${lab}
    <line class="xh" y1="${T}" y2="${T+ph}" style="display:none"/><g class="hov"></g>
    <rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent" style="cursor:crosshair"/></svg><div class="ctip"></div>`;
  const svgEl=el.querySelector('svg'),xh=el.querySelector('.xh'),hov=el.querySelector('.hov'),tip=el.querySelector('.ctip'),hit=el.querySelector('rect');
  const show=px=>{
    const t=t0+(px-L)/pw*(t1-t0);let tn=ts[0];for(const u of ts)if(Math.abs(u-t)<Math.abs(tn-t))tn=u;
    const X=x(tn);xh.setAttribute('x1',X);xh.setAttribute('x2',X);xh.style.display='';
    tip.textContent='';const hd=document.createElement('div');hd.className='d';hd.textContent=new Date(tn).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});tip.appendChild(hd);
    let dots='';
    ser.map(s=>({s,v:valAt(s.points,tn)})).filter(r=>r.v!=null).sort((a,b)=>b.v-a.v).forEach(({s,v})=>{
      const r=document.createElement('div');r.className='r';const k=document.createElement('i');k.style.background=s.color;
      const b=document.createElement('b');b.textContent=Math.round(v).toLocaleString();const n=document.createElement('span');n.textContent=s.name;
      r.append(k,b,n);tip.appendChild(r);dots+=`<circle cx="${X}" cy="${y(v)}" r="5" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>`;
    });
    hov.innerHTML=dots;tip.style.display='block';
    const tw=tip.offsetWidth;tip.style.left=Math.min(W-tw-4,Math.max(4,X+12>W-tw?X-tw-12:X+12))+'px';tip.style.top=T+'px';
  };
  hit.addEventListener('pointermove',e=>show(e.clientX-svgEl.getBoundingClientRect().left));
  hit.addEventListener('pointerleave',()=>{xh.style.display='none';hov.innerHTML='';tip.style.display='none'});
}

    if(c.stage==='Approved'&&c.submittedAt&&daysAgo(c.submittedAt)>=12)clipTask(c,'w','Check payout','Should have settled by now','paid');
  });
  S.campaigns.filter(k=>k.status==='Active'&&k.budgetLeft!==''&&k.budgetLeft!=null&&num(k.budgetLeft)<20).forEach(k=>{const aid=k.accountIds.find(acct);

    const ll=lastLog(a);

  });

}

function embedOf(u){
  let m;
  try{
    const x=new URL(u);const h=x.hostname.replace(/^(www|m)\./,'');
    if(h==='youtu.be')return {src:`https://www.youtube.com/embed/${x.pathname.slice(1)}`};
    if(h.endsWith('youtube.com')){
      if(m=x.pathname.match(/^\/(shorts|embed|live)\/([\w-]+)/))return {src:`https://www.youtube.com/embed/${m[2]}`,cls:m[1]==='shorts'?'tall':''};
      const v=x.searchParams.get('v');if(v)return {src:`https://www.youtube.com/embed/${encodeURIComponent(v)}`};
    }
    if(h.endsWith('tiktok.com')&&(m=x.pathname.match(/\/video\/(\d+)/)))return {src:`https://www.tiktok.com/embed/v2/${m[1]}`,cls:'tall'};
    if((h==='x.com'||h==='twitter.com')&&(m=x.pathname.match(/\/status(?:es)?\/(\d+)/)))return {src:`https://platform.twitter.com/embed/Tweet.html?id=${m[1]}&theme=dark`,cls:'doc'};
    if(h.endsWith('instagram.com')&&(m=x.pathname.match(/\/(p|reels?|tv)\/([\w-]+)/)))return {src:`https://www.instagram.com/${m[1]==='reels'?'reel':m[1]}/${m[2]}/embed`,cls:'tall'};
    if(h==='drive.google.com'){
      if(m=x.pathname.match(/\/file\/d\/([\w-]+)/))return {src:`https://drive.google.com/file/d/${m[1]}/preview`};
      if(m=x.pathname.match(/\/folders\/([\w-]+)/))return {src:`https://drive.google.com/embeddedfolderview?id=${m[1]}#grid`,cls:'doc'};
    }
    if(h==='docs.google.com'&&(m=x.pathname.match(/^\/(document|spreadsheets|presentation)\/d\/([\w-]+)/)))return {src:`https://docs.google.com/${m[1]}/d/${m[2]}/preview`,cls:'doc'};
    if(/\.(mp4|webm|mov)$/i.test(x.pathname))return {video:u};
    if(/\.(png|jpe?g|gif|webp)$/i.test(x.pathname))return {img:u};
  }catch(e){}
  return null;
}

/* ---------- 4. Review (inside an account) ---------- */
function groupBars(title,rows,emptyMsg){
  const max=Math.max(1,...rows.map(r=>r.avg));
  return `<div class="card"><h3 style="margin-bottom:8px">${title}</h3>${rows.length?rows.map(r=>`<div class="hbar"><span class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)} <span class="muted">(${r.n})</span></span><div class="bar"><i style="width:${r.avg/max*100}%"></i></div><span class="small num" style="text-align:right">${fmtN(r.avg)} avg</span></div>`).join(''):`<div class="muted small">${emptyMsg||'No data yet.'}</div>`}</div>`;
}
function grpMulti(list,keysFn){const m={};list.forEach(c=>{[].concat(keysFn(c)||[]).filter(Boolean).forEach(k=>{(m[k]=m[k]||[]).push(c)})});
  return Object.entries(m).map(([label,cs])=>({label,n:cs.length,avg:cs.reduce((a,c)=>a+views(c),0)/cs.length,earn:cs.reduce((a,c)=>a+est(c),0)})).sort((a,b)=>b.avg-a.avg)}
const grp=(list,keyFn)=>grpMulti(list,keyFn);
const lenB=c=>{const l=num(c.lengthSec);if(!l)return'';return l<20?'Under 20s':l<=45?'20–45s':'Over 45s'};
const wday=c=>new Date(c.postedAt+'T00:00:00').toLocaleDateString(undefined,{weekday:'long'});
function insights(withV,all){
  const out=[];
  if(withV.length<5)return [['','Log views on at least 5 posted clips to unlock insights. Views at 48h and 7 days are enough.']];
  const top=(rows,what)=>{const r=rows.filter(x=>x.n>=2);if(r.length>=2&&MED&&r[0].avg>MED)out.push(['',`<b>${esc(r[0].label)}</b> is your best ${what} — ${fmtN(r[0].avg)} avg, ${(r[0].avg/MED).toFixed(1)}× your median. Do more of it.`])};
  const low=(rows,what)=>{const r=rows.filter(x=>x.n>=3);const w=r[r.length-1];if(r.length>=3&&MED&&w.avg<MED*.5)out.push(['w',`<b>${esc(w.label)}</b> ${what} is underperforming (${fmtN(w.avg)} avg). Cut it or rework it.`])};
  top(grp(withV,c=>c.hookType),'hook type');low(grp(withV,c=>c.hookType),'hook');
  top(grpMulti(withV,c=>c.editStyle),'edit style');low(grpMulti(withV,c=>c.editStyle),'edit style');
  top(grp(withV,lenB),'clip length');
  top(grp(withV,wday),'posting day');
  top(grp(withV,c=>camp(c.campaignId)?.name),'campaign');
  S.campaigns.filter(k=>k.status==='Active').forEach(k=>{const cs=all.filter(c=>c.campaignId===k.id&&isPosted(c)&&daysAgo(c.postedAt)>=7);
    if(cs.length>=3){const per=cs.reduce((a,c)=>a+est(c),0)/cs.length;if(per<.5)out.push(['w',`<b>${esc(k.name)}</b> pays ${fmt$(per)} per clip after 7 days. Consider switching campaigns.`])}});
  const sub=all.filter(c=>c.submittedAt).length,rej=all.filter(c=>c.stage==='Rejected').length;
  if(sub>=4&&rej/sub>.2)out.push(['w',`${Math.round(rej/sub*100)}% of submissions get rejected. Check required tags before every submit.`]);
  return out.length?out:[['','No clear patterns yet — keep tagging hook types and edit styles.']];
}
function reviewSec(a){
  const all=S.clips.filter(c=>c.accountId===a.id);
  const list=all.filter(isPosted);
  const withV=list.filter(c=>views(c)>0);
  const rej=all.filter(c=>c.stage==='Rejected').length,sub=all.filter(c=>c.submittedAt).length;
  const cost=num(a.cost),earned=all.reduce((s,c)=>s+est(c),0);
  return `<div class="muted small">What's working on ${esc(a.handle)}, what isn't, and what to do about it. Check this weekly.</div>
  <div class="grid g4">
    ${tile('Median views',fmtN(MED),'per posted clip (7-day if logged)')}
    ${tile('Winners',String(withV.filter(c=>mult(c)>=3).length),'clips at 3× median or more')}
    ${tile('Est. $ / clip',fmt$(list.length?list.reduce((s,c)=>s+est(c),0)/list.length:0),'across posted clips')}
    ${a.monetized==='Paid'&&cost?tile('Payback',Math.round(earned/cost*100)+'%',`${fmt$(earned)} of ${fmt$(cost)}`):tile('Rejection rate',sub?Math.round(rej/sub*100)+'%':'—',`${rej} of ${sub} submitted`)}
  </div>
  <div class="card"><h3 style="margin-bottom:6px">Your edge — insights</h3>${insights(withV,all).map(([t,h])=>`<div class="insight"><span class="i ${t}">${t?'!':'↑'}</span><div class="small">${h}</div></div>`).join('')}</div>
  <div class="grid g3">
    ${groupBars('By hook type',grp(withV,c=>c.hookType))}
    ${groupBars('By edit style',grpMulti(withV,c=>c.editStyle))}
    ${groupBars('By clip length',grp(withV,lenB))}
    ${groupBars('By posting day',grp(withV,wday))}
    ${groupBars('By campaign',grp(withV,c=>camp(c.campaignId)?.name))}
  </div>
  <div class="sec-h"><h2>Every posted clip</h2><span class="muted small">★ = 3× median. Make more like these.</span></div>
  ${list.length?clipTable(list,['title','campaign','postedAt','hookType','style','lengthSec','views48','views7','mult','est','stage']):'<div class="empty">Post a clip and log its views to see what works.</div>'}
  <div class="card stack"><h3>Weekly review questions</h3><div class="muted small">Which hook type and edit style have the best average? ${a.monetized==='Paid'?'Is this paid account on track to pay itself back? ':''}Is any campaign under $0.50 per clip after 7 days — drop it. Did anything get rejected — what rule did it miss?</div></div>`;
}

/* ---------- Captions ---------- */
function vCaps(){
  const clips=S.clips.filter(c=>c.stage!=='Paid'&&c.stage!=='Rejected');
  const c=S.clips.find(x=>x.id===capState.clipId);const k=c&&camp(c.campaignId);
  const bank=(S.settings.hashtagBank||'').split(/\s+/).filter(Boolean);
  return `<div class="stack"><h1>Captions & hashtags</h1>
  <div class="grid g2">
    <div class="card stack">
      <h3>1 · Build the AI prompt</h3>
      <div><label class="f">Clip</label><select id="cap_clip" onchange="capState.clipId=this.value;capState.tags=[];render()"><option value="">— Pick a clip —</option>${clips.map(x=>`<option value="${x.id}" ${x.id===capState.clipId?'selected':''}>${esc(x.title)} · ${x.stage}</option>`).join('')}</select></div>
      ${k?`<div class="small"><span class="muted">Campaign:</span> ${esc(k.name)}${k.requiredTags?` · <span class="muted">Required:</span> ${esc(k.requiredTags)}`:''}</div>`:''}
      <div><label class="f">Transcript of the clip</label><textarea id="cap_tr" placeholder="Paste the transcript from Opus Clip or CapCut auto-captions" oninput="capState.transcript=this.value">${esc(capState.transcript)}</textarea></div>
      <div class="row"><button class="btn primary" onclick="buildPrompt()">Build prompt</button><button class="btn" onclick="copy(document.getElementById('cap_prompt').value)">Copy prompt</button></div>
      <textarea id="cap_prompt" readonly style="min-height:150px" placeholder="Your prompt shows up here. Paste it into Claude or ChatGPT."></textarea>
    </div>
    <div class="card stack">
      <h3>2 · Final caption</h3>
      <div><label class="f">Caption</label><textarea id="cap_txt" placeholder="Paste the best caption from the AI" oninput="capPreview()">${esc(c&&c.caption?c.caption.replace(/\n\n#.*$/s,''):'')}</textarea></div>
      <div><label class="f">Hashtags — tap to add</label><div class="row" id="cap_bank">${bank.map(t=>`<span class="chip click ${capState.tags.includes(t)?'on':''}" onclick="toggleTag('${esc(t)}')">${esc(t)}</span>`).join('')||'<span class="muted small">Add a hashtag bank in Settings.</span>'}</div></div>
      <div class="muted small">Required campaign tags are added automatically. Keep it to 3–5 niche tags.</div>
      <div><label class="f">Preview <span id="cap_cnt"></span></label><textarea id="cap_out" readonly style="min-height:110px"></textarea></div>
      <div class="row"><button class="btn primary" onclick="copy(document.getElementById('cap_out').value)">Copy caption</button>${c?`<button class="btn" onclick="saveCap()">Save to clip</button>`:''}</div>
    </div>
  </div></div>`;
}
function toggleTag(t){const i=capState.tags.indexOf(t);if(i>=0)capState.tags.splice(i,1);else capState.tags.push(t);
  document.querySelectorAll('#cap_bank .chip').forEach(el=>el.classList.toggle('on',capState.tags.includes(el.textContent)));capPreview()}
function capPreview(){
  const el=document.getElementById('cap_out');if(!el)return;
  const c=S.clips.find(x=>x.id===capState.clipId);const k=c&&camp(c.campaignId);
  const txt=document.getElementById('cap_txt').value.trim();
  const req=k&&k.requiredTags?k.requiredTags.trim():'';
  const tags=[req,...capState.tags.filter(t=>!req.includes(t))].filter(Boolean).join(' ');
  el.value=(txt+(tags?'\n\n'+tags:'')).trim();
  document.getElementById('cap_cnt').textContent=`· ${el.value.length} chars`;
}
function buildPrompt(){
  const c=S.clips.find(x=>x.id===capState.clipId);const k=c&&camp(c.campaignId);const a=c&&acct(c.accountId);
  const tr=document.getElementById('cap_tr').value.trim();
  if(!tr){toast('Paste the transcript first');return}
  const p=`You're writing post copy for a short-form clip going on ${a?a.platform:'TikTok, YouTube Shorts, Instagram Reels and X'}.
Niche: ${(a&&a.niche)||S.settings.niche||'general'}
${k?`Campaign: ${k.name}\n`:''}${k&&k.requiredTags?`Required tags/mentions (must appear exactly): ${k.requiredTags}\n`:''}${c&&c.hookType?`Hook angle I'm going for: ${c.hookType}\n`:''}
Transcript:
"""
${tr}
"""

Give me:
1. 5 on-screen hook lines for the first 2 seconds (max 8 words each, curiosity-driven, nothing the clip doesn't deliver)
2. 3 caption options under 150 characters
3. 1 YouTube Shorts title under 70 characters
4. 5 niche hashtags (no generic #fyp / #viral)

Plain text, numbered, no explanations.`;
  document.getElementById('cap_prompt').value=p;
}
function saveCap(){const c=S.clips.find(x=>x.id===capState.clipId);if(!c)return;c.caption=document.getElementById('cap_out').value;save();toast('Saved to clip')}

/* ---------- Playbook ---------- */
function vPlay(){
  const steps=[
    ['Accounts',['One niche per account, same handle on TikTok, YouTube, Instagram and X','Tag pre-monetized accounts as Paid and log what you paid — track payback','Warm new pages 3–5 days: scroll and engage in your niche before posting','Warm bought pages in your niche too before the first campaign post']],
    ['Campaigns',['Rate of $1+ per 1,000 views, with plenty of budget left','Check the per-clip cap and minimum views','Make sure your platforms are allowed','Read the whole brief — missed tags are the #1 rejection reason','Save the brief, source episodes and examples as resources']],
    ['Content — find moments',['Run the source through Opus Clip for candidate timestamps','Watch the top 10 yourself — you pick, not the AI','Hook in the first 2 seconds, makes sense alone, has a peak','Aim for 20–45 seconds · drop them in with Bulk add']],
    ['Content — edit',['9:16 framed on the speaker, cut dead air and filler','Hook text on screen from frame one','Captions burned in, light zooms and sound effects','Add your own layer (title, context, voiceover) — platforms cut reach for low-effort reuploads','Tag the hook type and edit style on every clip']],
    ['Content — post & submit',['Upload natively to each platform; use "Copy to another account" for multi-posting','Batch-edit on off days, schedule posts — hit your daily target','Submit the post link right after it goes live; screenshot it in case you need to appeal']],
    ['Review',['Log views at 48 hours and 7 days','Read the insights weekly: best hooks, edit styles, lengths, days and accounts','Remix the winners, drop campaigns that never pay']],
  ];
  return `<div class="stack"><h1>Playbook</h1><div class="grid g2">${steps.map(([t,l],i)=>`<div class="card step"><div class="n">${i+1}</div><div><h3>${t}</h3><ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`).join('')}</div></div>`;
}

/* ---------- Settings ---------- */
function vSettings(){
  const s=S.settings;
  return `<div class="stack"><h1>Settings</h1>
  <div class="card stack"><div class="fields">
    <div><label class="f">Daily post target (clips)</label><input type="number" id="s_t" value="${esc(s.dailyTarget)}"></div>
    <div><label class="f">Marketplace fee (%)</label><input type="number" id="s_f" value="${esc(s.feePct)}"></div>
    <div><label class="f">Your niche</label><input id="s_n" value="${esc(s.niche)}"></div>
    <div class="full"><label class="f">Hashtag bank (space-separated)</label><textarea id="s_h">${esc(s.hashtagBank)}</textarea></div>
  </div><div><button class="btn primary" onclick="saveSettings()">Save settings</button></div></div>
  <div class="card stack"><h3>Backup</h3>
    <div class="muted small">Your data lives in this browser only. Clearing site data or switching devices loses it — export a backup weekly, and import it on any other device.</div>
    <div class="row"><button class="btn" onclick="exportJSON()">Export backup (.json)</button><label class="btn">Import backup<input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(this)"></label><button class="btn" onclick="exportCSV()">Export clips (.csv)</button></div>
    <div class="muted small">${S.brands.length} brands · ${S.accounts.length} accounts · ${S.campaigns.length} campaigns · ${S.clips.length} clips · ${S.resources.length} resources</div>
  </div>
  <div class="card stack"><h3>Danger zone</h3><div><button class="btn danger" onclick="resetAll()">Erase all data</button></div></div></div>`;
}
function saveSettings(){S.settings={...S.settings,dailyTarget:num(document.getElementById('s_t').value)||1,feePct:num(document.getElementById('s_f').value),niche:document.getElementById('s_n').value.trim(),hashtagBank:document.getElementById('s_h').value.trim()};save();render();toast('Settings saved')}
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportJSON(){download(`clipper-backup-${today()}.json`,JSON.stringify(S,null,2),'application/json')}
function exportCSV(){
  const cols=['title','stage','account','platform','campaign','hookType','hook','editStyle','lengthSec','sourceUrl','sourceTs','postedAt','submittedAt','views48','views7','likes','shares','est','paid','postUrl'];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const val=(c,k)=>k==='campaign'?camp(c.campaignId)?.name:k==='account'?acct(c.accountId)?.handle:k==='platform'?acct(c.accountId)?.platform:k==='est'?est(c).toFixed(2):k==='editStyle'?(c.editStyle||[]).join('; '):c[k];
  const lines=[cols.join(',')].concat(S.clips.map(c=>cols.map(k=>q(val(c,k))).join(',')));
  download(`clipper-clips-${today()}.csv`,lines.join('\n'),'text/csv');
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.clips)||!Array.isArray(d.campaigns))throw 0;
    if(!confirm('Replace everything here with this backup?'))return;LOAD_ERR=null;S=hydrate(d);save();render();toast('Backup imported')}
    catch(e){toast('That file isn\'t a Clipper backup')}};
  r.readAsText(f);
}
function resetAll(){if(!confirm('Erase all Clipper data in this browser? Export a backup first if you need it.'))return;LOAD_ERR=null;S=defaults();save();render();toast('Erased')}

/* ---------- Pomodoro sidebar ---------- */
const PK=LS_KEY+'.pomo';
const PLABEL={focus:'Focus',short:'Short break',long:'Long break'};
const PDEF={mode:'focus',running:false,endAt:0,left:25*60e3,lens:{focus:25,short:5,long:15},goal:8,done:0,day:'',task:'',open:false};
let P={...PDEF};
try{P={...PDEF,...JSON.parse(localStorage.getItem(PK)||'{}')}}catch(e){}
P.lens={...PDEF.lens,...P.lens};
const pSave=()=>{try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){}};
const pLen=m=>(num(P.lens[m])||PDEF.lens[m])*60e3;
const pLeft=()=>P.running?Math.max(0,P.endAt-Date.now()):P.left;
const mmss=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function togglePomo(force){
  P.open=force??!P.open;pSave();
  document.getElementById('pomo').classList.toggle('open',P.open);
  document.body.classList.toggle('pomo-open',P.open);
  if(P.open)renderPomo();
}
function pSet(m){P.mode=m;P.running=false;P.left=pLen(m);pSave();renderPomo()}
function pStart(){
  if(P.running){P.left=pLeft();P.running=false}
  else{P.endAt=Date.now()+P.left;P.running=true;try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
  pSave();renderPomo();
}
function pReset(){P.running=false;P.left=pLen(P.mode);pSave();renderPomo()}
function pSkip(){pSet(P.mode==='focus'?'short':'focus')}
function pDone(){
  const was=P.mode;
  if(was==='focus')P.done++;
  pSet(was==='focus'?(P.done%4===0?'long':'short'):'focus');
  chime();
  const m=was==='focus'?`Focus block done (${P.done} today) — take a ${P.mode==='long'?'long ':''}break`:'Break over — back to it';
  toast(m);try{if('Notification' in window&&Notification.permission==='granted')new Notification('Clipper',{body:m})}catch(e){}
}
function chime(){
  try{const c=new (window.AudioContext||window.webkitAudioContext)();
    [660,880,990].forEach((f,i)=>{const t=c.currentTime+i*.22,o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.start(t);o.stop(t+.22)})}catch(e){}
}
function pLenSet(m,v){P.lens[m]=num(v)||PDEF.lens[m];if(!P.running&&P.mode===m)P.left=pLen(m);pSave();renderPomo()}
function renderPomo(){
  const el=document.getElementById('pomo');if(!P.open){el.innerHTML='';return}
  el.innerHTML=`<div class="hd"><h3>Focus timer</h3><button class="btn ghost" onclick="togglePomo(false)" aria-label="Close timer">✕</button></div>
  <div class="bd stack">
    <div class="seg" style="display:flex">${Object.keys(PLABEL).map(m=>`<button class="${P.mode===m?'on':''}" style="flex:1" onclick="pSet('${m}')">${PLABEL[m]}</button>`).join('')}</div>
    <div class="ring"><svg width="220" height="220" viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="none" stroke="var(--panel2)" stroke-width="10"/>
      <circle id="p_arc" cx="110" cy="110" r="100" fill="none" stroke="${P.mode==='focus'?'var(--accent)':'var(--good)'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="628.32"/></svg>
      <div class="t"><div><b id="p_time"></b><div class="muted small">${PLABEL[P.mode]}</div></div></div></div>
    <div class="row" style="justify-content:center"><button class="btn primary" id="p_go" onclick="pStart()"></button><button class="btn" onclick="pReset()">Reset</button><button class="btn" onclick="pSkip()">Skip ›</button></div>
    <div><label class="f" for="p_task">Working on</label><input id="p_task" value="${esc(P.task)}" placeholder="e.g. Edit 3 clips for @tradeclips" oninput="P.task=this.value;pSave()"></div>
    <div><div class="row between small" style="margin-bottom:6px"><span class="muted">Focus blocks today</span><span>${P.done} / ${P.goal}</span></div>
      <div class="tomatoes">${Array.from({length:Math.max(P.goal,P.done)},(_,i)=>`<i class="${i<P.done?'on':''}"></i>`).join('')}</div></div>
    <details><summary class="small muted" style="cursor:pointer">Timer settings</summary>
      <div class="fields" style="grid-template-columns:repeat(2,1fr);margin-top:10px">
        ${Object.keys(PLABEL).map(m=>`<div><label class="f">${PLABEL[m]} (min)</label><input type="number" min="1" value="${esc(P.lens[m])}" onchange="pLenSet('${m}',this.value)"></div>`).join('')}
        <div><label class="f">Daily goal</label><input type="number" min="1" value="${esc(P.goal)}" onchange="P.goal=num(this.value)||8;pSave();renderPomo()"></div>
      </div></details>
    <div class="muted small">Batch-edit clips in focus blocks. Post, reply to comments and log views on breaks. Every 4th break is a long one.</div>
  </div>`;
  pTick();
}
function pTick(){
  if(P.day!==today()){P.day=today();P.done=0;pSave();if(P.open)renderPomo()}
  if(P.running&&pLeft()<=0)pDone();
  const l=pLeft(),btn=document.getElementById('pomoBtn');
  btn.textContent=P.running?`⏱ ${mmss(l)}`:'⏱ Focus';
  btn.classList.toggle('run',P.running);
  document.title=P.running?`${mmss(l)} · ${PLABEL[P.mode]} — Clipper`:'Clipper';
  const t=document.getElementById('p_time');if(!t)return;
  t.textContent=mmss(l);
  document.getElementById('p_arc').style.strokeDashoffset=String(628.32*(1-l/pLen(P.mode)));
  document.getElementById('p_go').textContent=P.running?'Pause':l<pLen(P.mode)?'Resume':'Start';
}
setInterval(pTick,500);

parseHash();
render();
if(P.open)togglePomo(true);
pTick();
</script>
</body>
